# yaml-language-server: $schema=../../../../../../../../../conventions/deployment/descriptor/deploy.schema.json
# What this product deploys: its sites, its services, how each builds, what changes it and which paths it serves.
# Format and rules: wow-two-ws/conventions/deployment/descriptor/deploy-descriptor.md. Hostnames, secrets and
# environments live in Wheelhouse targets, never here. Paths are relative to engineering/.
#
# Ocharo Studio is one image: the .NET API serving the Vue 3D editor, its state in schema `studio` of the product
# database (`ocharo_{env}`, shared with Desk and Identity). It is a repository of the one `ocharo` product (Wheelhouse
# decision 70), so its site and volume carry its own name.
# Dev runs as .NET Development, prod as Production (dotnetEnvironment). Signing in is optional: the editor works in the
# browser for anyone, and server state needs a session from Ocharo's Identity, which ocharo-platform's descriptor declares.
# Sessions (schema `studio_cache`) and the Data Protection key ring (`studio.data_protection_keys`) live in that database,
# so a restart or deploy keeps everyone signed in.
descriptor: 2
product: ocharo
dotnetEnvironment: true                 # dev runs as .NET Development, prod as Production
verify:                                 # after a dev rollout: the host answers, then reports its build
  service: studio
  command: [sh, -c, 'curl --fail --silent --show-error --header "Host: localhost" "$VERIFY_SERVICE_STUDIO/health/ready" > /dev/null && curl --fail --silent --show-error --header "Host: localhost" "$VERIFY_SERVICE_STUDIO/api/system/status"']
  timeout: 2m
# Studio's image applies its `studio` set (keyed into Identity's published accounts and organizations, so ocharo-platform's
# identity item runs first) and its session cache's `distributed_cache` set, before Studio restarts; Wheelhouse fills
# Migrations:ConnectionString from the target's database.
migrate:
  - service: studio
    command: [dotnet, OcharoStudio.Api.dll, migrate]
    timeout: 5m
sites:
  studio: {}                            # public: a domain, or Wheelhouse's sslip.io host until one is bound
services:
  studio:
    name: Ocharo Studio
    description: A browser-based 3D studio for composing Uzbek garment looks with per-part textile placement on a mannequin.
    build: { dockerfile: deployment/Dockerfile }
    paths:
      - codebase/ocharo-studio.backend-services/**
      - codebase/ocharo-studio.frontend-services/**
    health: /health/ready                 # the database and the studio schema answer
    needs: [postgres]
    settings:                           # mounted at /app/appsettings.Target.json
      # Wheelhouse derives Deployment:TrustedProxies (the ingress address) and AllowedHosts, and fills
      # ConnectionStrings:Database from the target's own PostgreSQL; nobody types them.
      required: [ConnectionStrings:Database, Deployment:TrustedProxies]
      keys:
        # Sign-in through Ocharo's Identity as client 5, whose keys ocharo-platform's descriptor declares. Studio binds no
        # organization: each member's workspace derives from the session's organization and subject, and saving needs studio:edit.
        Identity:Client:Authority: { from: { repository: platform, key: Sites:identity:Url } }
        Identity:Client:ClientId: { default: studio }
        Identity:Client:ClientSecret: { from: { repository: platform, key: Identity:Server:Clients:5:ClientSecret } }
        Identity:Client:CookieName: { default: __Host-ocharo-studio }
        Identity:Client:SignalUrl: { from: { repository: platform, key: Identity:Server:Clients:5:SignalUrl } }
        Identity:Client:PostSignOutRedirectPath: { default: "/" }
        # Saved-look thumbnails live in WoW2 Files, tenant `ocharo` on the shared files host, reached with the same client
        # through the member's exchanged token; linked to the Uri ocharo-platform types for its Files resource.
        Files:BaseUrl: { from: { repository: platform, key: Identity:Server:Resources:2:Uri } }
        # The Ocharo app menu, served anonymously at /api/runtime-config; an unset key leaves that app out. Apps whose
        # site root is the place to land link to that site, so nobody types them; Marketing deploys no site yet, and
        # Editorial, Atlas and Wear sit under a path of the blog site, so those stay typed by the owner.
        OcharoApps:Desk: { from: { repository: platform, key: Sites:desk:Url } }
        OcharoApps:Catalogue: { from: { repository: platform, key: Sites:catalogue:Url } }
        OcharoApps:Studio: { from: Sites:studio:Url }
        OcharoApps:Brand: { from: { repository: platform, key: Sites:brand:Url } }
        OcharoApps:Marketing: { type: url }
        OcharoApps:Editorial: { type: url }
        OcharoApps:Atlas: { type: url }
        OcharoApps:Wear: { type: url }
        OcharoApps:Blog: { type: url }
    # The retired SQLite store and file key ring wait here until `import-sqlite` copies them once per environment
    # (engineering/deployment/deployment.md § PostgreSQL move); the volume then holds only the retired copies.
    volumes:
      studio-data: /app/appdata
    sites:
      studio: {}
