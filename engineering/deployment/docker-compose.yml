# One UzbekStudio instance per environment. Bring up from engineering/deployment/:
#
#   docker compose up -d --build
#
# Designs are saved locally in each browser; export JSON for portable backups.
services:
  uzbekstudio:
    build:
      context: ../codebase
      dockerfile: ../deployment/Dockerfile
    image: uzbekstudio
    container_name: uzbekstudio
    restart: unless-stopped
    ports:
      - "127.0.0.1:18260:8080"
