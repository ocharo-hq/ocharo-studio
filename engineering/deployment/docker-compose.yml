# One OcharoStudio instance per environment. Bring up from engineering/deployment/:
#
#   docker compose up -d --build
#
# Studio state lives in PostgreSQL (the `postgres` service below). The database must also hold Identity's migration
# set, so this preview still does not boot alone. `ocharo-studio-data` stays mounted for the one-time `import-sqlite`.
services:
  ocharo-studio:
    build:
      context: ../codebase
      dockerfile: ../deployment/Dockerfile
    image: ocharo-studio
    container_name: ocharo-studio
    restart: unless-stopped
    ports:
      - "127.0.0.1:18260:8080"
    environment:
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=ocharo_local;Username=postgres;Password=studio-local"
    depends_on:
      - postgres
    volumes:
      - ocharo-studio-data:/app/appdata

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ocharo_local
      POSTGRES_PASSWORD: studio-local
    volumes:
      - ocharo-studio-pgdata:/var/lib/postgresql

volumes:
  ocharo-studio-data:
  ocharo-studio-pgdata:
