<!doctype html>
<!-- `theme-ocharo` applies the fe SDK's Ocharo theme; the pre-paint script adds `dark` beside it. -->
<html lang="en" class="theme-ocharo">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- The SDK pre-paint colour script, generated by vite.config.ts: applies the remembered mode before the first paint. -->
    <script src="%BASE_URL%theme.js"></script>
    <link rel="stylesheet" href="%BASE_URL%boot-splash.css" />
    <meta
      name="theme-color"
      content="#f5f6fa"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#141416"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="A creative 3D atelier for Uzbek-inspired clothing. Choose a silhouette, explore textiles, and save your own looks."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Ocharo Studio — Your creative atelier</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
