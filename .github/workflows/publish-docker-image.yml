# Verifies, builds and publishes Ocharo Studio like every product, through the shared delivery workflow in
# wow-two-platform.pipelines (current → plan → ci → publish):
#   main          → release vX.Y.Z (X.Y from the newest version-track folder), bundle on the GitHub release
#   other branches → candidate sha-<commit>, bundle as an Actions artifact
#   workflow_dispatch → a candidate for one commit that has no build yet (Wheelhouse's Build action)
#   pull request  → ci only
# Image: ghcr.io/ocharo-hq/ocharo-studio/studio, the one service in engineering/deployment/deploy.yml.
# The full browser suite runs on every frontend or test change (tests live in the frontend workspace), and on any
# change no check owns, such as a workflow; a backend-only change runs the host checks; a docs-only push runs nothing.
# Wheelhouse deploys the bundle.
# Pipelines e134a47 is untagged, so its full SHA pins it: the first commit whose generator accepts deploy.yml's
# `from` naming another repository of the product.
name: publish-docker-image

on:
  push:
    branches: ['**', '!renovate/**']
  pull_request:
  workflow_dispatch:
    inputs:
      commit:
        description: The full commit SHA to build
        required: true

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: delivery-${{ github.repository }}-${{ inputs.commit || github.ref }}
  # One run per ref at a time, queued, so each release reads the tag the previous one created. No cancel-in-progress:
  # GitHub refuses queue: max beside one that evaluates true, and starts no job.
  queue: max

jobs:
  delivery:
    uses: wow-two-platform/wow-two-platform.pipelines/.github/workflows/delivery.yml@e134a47a298970bc6c2d504255a935b89b32a40f
    with:
      commit: ${{ inputs.commit }}
      backends: |
        [{"name": "Host", "dir": "engineering/codebase/ocharo-studio.backend-services", "dotnet": "10.0.x",
          "timeout": 20,
          "run": ["dotnet build OcharoStudio.BackendServices.slnx -p:BuildSpa=false",
                  "dotnet test OcharoStudio.BackendServices.slnx --no-build"],
          "paths": ["engineering/codebase/ocharo-studio.backend-services/**"]}]
      frontends: |
        [{"name": "Frontend", "dir": "engineering/codebase/ocharo-studio.frontend-services", "node": ".nvmrc",
          "lfs": "engineering/codebase/**", "scripts": ["lint", "format:check", "typecheck", "test", "build"],
          "paths": ["engineering/codebase/ocharo-studio.frontend-services/**"]}]
      # Split isolated tests evenly; each runner keeps one software-rendering worker. All shards are required; no
      # retries or exclusions mask failures. The API compiles in the background while the SPA builds and Chromium
      # installs, so Playwright's `dotnet run` starts from an up-to-date build; the Frontend check type-checks, and the
      # tests reach the API through the Vite preview, so the SPA is built without either and never copied into wwwroot.
      # The API reads a PostgreSQL container the setup starts and prepares with Identity's stand-in tables and Studio's
      # sets (OcharoStudio.Tests.Support).
      browser: |
        {"name": "Browser", "dir": "engineering/codebase/ocharo-studio.frontend-services", "shards": 3,
         "dotnet": "10.0.x", "node": ".nvmrc", "lfs": "engineering/codebase/**", "timeout": 30,
         "setup": ["docker run -d --name studio-postgres -e POSTGRES_PASSWORD=browser-tests -p 55432:5432 postgres:18-alpine",
                   "dotnet build ../ocharo-studio.backend-services/OcharoStudio.Api -p:BuildSpa=false > \"$RUNNER_TEMP/api-build.log\" 2>&1 &",
                   "api=$!",
                   "pnpm --filter @ocharo-studio/web exec vite build",
                   "pnpm --filter @ocharo-studio/web exec playwright install --with-deps chromium",
                   "bash scripts/prepare-ci-https.sh",
                   "wait \"$api\" || { cat \"$RUNNER_TEMP/api-build.log\"; exit 1; }",
                   "until docker exec studio-postgres pg_isready -U postgres -q; do sleep 1; done",
                   "dotnet run --project ../ocharo-studio.backend-services/tests/OcharoStudio.Tests.Support -- 'Host=localhost;Port=55432;Username=postgres;Password=browser-tests;Database=studio_browser'"],
         "run": "pnpm --filter @ocharo-studio/web exec playwright test --fully-parallel --workers=1 --shard=\"$SHARD/$SHARDS\"",
         "artifact": "engineering/codebase/ocharo-studio.frontend-services/apps/web/test-results/",
         "paths": ["engineering/codebase/ocharo-studio.frontend-services/**"]}
