name: Verify studio
# Called once per push by publish-docker-image (which gates publication on it), and directly for pull requests.
on:
  pull_request:
  workflow_call:
    inputs:
      commit:
        description: Immutable commit selected by the delivery workflow
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: studio-verify-${{ inputs.commit || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Frontend and host checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit || github.sha }}
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: engineering/codebase/ocharo-studio.frontend-services/pnpm-lock.yaml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify frontend
        working-directory: engineering/codebase/ocharo-studio.frontend-services
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm format:check
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Verify host
        working-directory: engineering/codebase/ocharo-studio.backend-services
        run: |
          python3 shared/sync-sso.py --check
          dotnet build OcharoStudio.BackendServices.slnx -p:BuildSpa=false
          dotnet test OcharoStudio.BackendServices.slnx --no-build

  browser:
    name: Browser (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Browser dependency installation can take ten minutes; tests keep their own bounded timeouts.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit || github.sha }}
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: engineering/codebase/ocharo-studio.frontend-services/pnpm-lock.yaml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Prepare browser dependencies
        working-directory: engineering/codebase/ocharo-studio.frontend-services
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm --filter @ocharo-studio/web exec playwright install --with-deps chromium
      - name: Prepare trusted CI HTTPS
        run: bash engineering/codebase/ocharo-studio.frontend-services/scripts/prepare-ci-https.sh
      - name: Verify browser workflows
        working-directory: engineering/codebase/ocharo-studio.frontend-services
        env:
          STUDIO_URL: https://localhost:8262
          SHARD: ${{ matrix.shard }}
        # Split isolated tests evenly; each runner keeps one software-rendering worker.
        # All shards are required; no retries or test exclusions mask failures.
        run: pnpm --filter @ocharo-studio/web exec playwright test --fully-parallel --workers=1 --shard="$SHARD/3"
      - name: Retain failed browser evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: studio-browser-failure-${{ matrix.shard }}
          path: engineering/codebase/ocharo-studio.frontend-services/apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  verify:
    name: verify
    if: always()
    needs: [checks, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks and browser shards
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          if not results or any(result != 'success' for result in results):
              raise SystemExit(f'Verification jobs did not all pass: {results}')
          PY
